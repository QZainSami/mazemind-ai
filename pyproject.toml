[project]
name = "mazemind"
version = "0.1.0"
description = "MazeMind AI: Intelligent Puzzle Solver, Evolutionary Level Generator & Search Performance Predictor"
readme = "README.md"
authors = [
    { name = "QZainSami", email = "qsamiullah90@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
