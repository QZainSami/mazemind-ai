[project]
name = "mazemind"
version = "0.1.0"
description = "MazeMind AI: Intelligent Puzzle Solver & Search Algorithm Visualizer (CSL-325 Artificial Intelligence Lab, Fall 2026)"
readme = "README.md"
authors = [
    { name = "Samiullah Qureshi", email = "qsamiullah90@gmail.com" },
    { name = "Muhammad Musavir Waseem", email = "musavirrizvi349@gmail.com" },
    { name = "Farman Ali", email = "farmanalichhajro@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "streamlit>=1.40.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
